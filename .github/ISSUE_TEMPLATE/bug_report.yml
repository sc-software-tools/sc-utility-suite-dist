name: Bug Report
description: Report an issue or unexpected behavior in any SC Utility Suite application.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue! Please describe the problem clearly below.
  - type: dropdown
    id: application
    attributes:
      label: Application
      description: Which application is experiencing the issue?
      options:
        - Archive Unpacker
        - Dup Scrub
        - HEIC Studio
        - Media Trim
        - PDF Knife
        - Screen Lens
        - USB Flasher
        - Suite Installer / Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 (64-bit)
        - Windows 10 (64-bit)
        - Other Windows Edition
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Open the application
        2. Drag and drop file...
        3. Click 'Convert' / 'Scan'...
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
