name: Sync Microsoft Store Analytics

on:
  schedule:
    # Twice an hour, off the top of the hour: GitHub delays or drops scheduled runs at :00 when it is busy
    # (on 21 Nov 2026 three hourly runs were skipped), and a missed run is covered by the next one 30 minutes later.
    - cron: '17,47 * * * *'
  workflow_dispatch:        # Allows manual one-click trigger anytime

permissions:
  contents: write

concurrency:
  group: sync-store-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_SNAP_LOGIN: ${{ secrets.SNAPCRAFT_METRICS_LOGIN != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Install snapcraft (Snap Store metrics)
        if: ${{ env.HAS_SNAP_LOGIN == 'true' }}
        run: sudo snap install snapcraft --classic

      - name: Sync Store Analytics
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_METRICS_LOGIN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: python scripts/sync_store_stats.py

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add store-stats.json ecosystem-data.json stats.html
          git diff-index --quiet HEAD && exit 0
          git commit -q -m "Auto-sync Microsoft Store and Gumroad analytics"
          # These files are regenerated whole each run, so this run's copy always wins over anything pushed meanwhile
          # (in a rebase, "theirs" is the commit being replayed: ours). Retry if another push lands in between.
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase -X theirs && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the refreshed stats after 5 attempts"; exit 1
